[package]
name = "cf-mail-proxy"
version = "0.2.0"
edition = "2021"
description = "SMTP to Cloudflare Email Sending REST API proxy"
license = "MIT"

[[bin]]
name = "cf-mail-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-parser = "0.11"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
base64 = "0.22"
once_cell = "1"
quoted_printable = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
