name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: rename artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/cf-mail-proxy dist/cf-mail-proxy-linux-x86_64
          (cd dist && sha256sum cf-mail-proxy-linux-x86_64 > cf-mail-proxy-linux-x86_64.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cf-mail-proxy-linux-x86_64
            dist/cf-mail-proxy-linux-x86_64.sha256
          generate_release_notes: true
